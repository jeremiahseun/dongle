name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: dongle-darwin-arm64
            cxx: clang++
            flags: -arch arm64
          - os: macos-latest
            artifact: dongle-darwin-x64
            cxx: clang++
            flags: -arch x86_64
          - os: ubuntu-latest
            artifact: dongle-linux-x64
            cxx: g++
            flags: ""
          - os: ubuntu-24.04-arm
            artifact: dongle-linux-arm64
            cxx: g++
            flags: ""

    runs-on: \${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Compile Native C++17 Binary
        run: |
          mkdir -p release_pack/${{ matrix.artifact }}
          ${{ matrix.cxx }} -O3 -std=c++17 ${{ matrix.flags }} src/dongle.cpp -o release_pack/${{ matrix.artifact }}/dongle
          strip release_pack/${{ matrix.artifact }}/dongle 2>/dev/null || true
          chmod +x release_pack/${{ matrix.artifact }}/dongle

          # Create convenience copies for subcommand entrypoints
          cp release_pack/${{ matrix.artifact }}/dongle release_pack/${{ matrix.artifact }}/dongle-pick
          cp release_pack/${{ matrix.artifact }}/dongle release_pack/${{ matrix.artifact }}/dongle-scan
          cp release_pack/${{ matrix.artifact }}/dongle release_pack/${{ matrix.artifact }}/dongle-list

          cd release_pack && tar -czf ../${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: \${{ matrix.artifact }}
          path: \${{ matrix.artifact }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries/

      - name: Prepare release files
        run: |
          mkdir -p release
          for dir in binaries/*/; do
            cp "\$dir"* release/ 2>/dev/null || true
          done
          chmod +x release/*
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
